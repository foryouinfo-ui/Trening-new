<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trening PRO Final</title>
  <style>
    :root{
      --bg:#020617;
      --bg2:#0f172a;
      --card:#111827;
      --muted:#1f2937;
      --soft:#0b1220;
      --line:rgba(148,163,184,.15);
      --text:#f8fafc;
      --sub:#cbd5e1;
      --green:#22c55e;
      --blue:#38bdf8;
      --red:#ef4444;
      --orange:#f59e0b;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,var(--bg),var(--bg2));
      color:var(--text);
      min-height:100vh;
    }
    .app{
      max-width:920px;
      margin:0 auto;
      padding:12px 12px 110px;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      padding:10px 0 12px;
      backdrop-filter:blur(12px);
      background:linear-gradient(180deg, rgba(2,6,23,.96), rgba(2,6,23,.78));
    }
    h1{
      margin:0 0 4px;
      font-size:1.45rem;
    }
    .sub{color:var(--sub);font-size:.93rem}
    .card{
      background:rgba(17,24,39,.96);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:14px;
      margin-top:12px;
      box-shadow:0 12px 28px rgba(0,0,0,.25);
    }
    .days,.toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .days{
      overflow:auto;
      flex-wrap:nowrap;
      scrollbar-width:none;
    }
    .days::-webkit-scrollbar{display:none}
    button,input,textarea,select{font:inherit}
    .btn,.day-btn,.small-btn{
      border:0;
      border-radius:14px;
      padding:12px 14px;
      font-weight:800;
      cursor:pointer;
    }
    .btn{
      background:var(--green);
      color:#052e16;
      width:100%;
      margin-top:10px;
    }
    .btn.secondary,.day-btn,.small-btn{
      background:var(--muted);
      color:var(--text);
    }
    .btn.danger{background:var(--red);color:white}
    .active{background:var(--blue)!important;color:#062033!important}
    .badge{
      display:inline-block;
      font-size:.78rem;
      border-radius:999px;
      padding:6px 10px;
      background:rgba(56,189,248,.16);
      color:#bae6fd;
      white-space:nowrap;
    }
    .title{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .exercise{
      font-size:1.05rem;
      font-weight:800;
    }
    .muted{color:var(--sub);font-size:.92rem}
    .small{color:var(--sub);font-size:.82rem}
    .grid-2,.stats{
      display:grid;
      gap:10px;
    }
    .grid-2{grid-template-columns:1fr 1fr}
    .stats{grid-template-columns:repeat(3,1fr);margin-top:10px}
    .stat{
      background:rgba(15,23,42,.72);
      border:1px solid rgba(148,163,184,.12);
      border-radius:14px;
      padding:12px;
    }
    .stat small{display:block;color:var(--sub);margin-bottom:6px}
    .stat strong{font-size:1rem}
    label{
      display:block;
      margin-bottom:6px;
      color:var(--sub);
      font-size:.84rem;
      font-weight:700;
    }
    input,textarea,select{
      width:100%;
      padding:13px 12px;
      border-radius:14px;
      border:1px solid rgba(148,163,184,.18);
      background:var(--soft);
      color:var(--text);
    }
    textarea{min-height:84px;resize:vertical}
    .set-row{
      background:rgba(31,41,55,.62);
      border:1px solid rgba(148,163,184,.12);
      border-radius:16px;
      padding:12px;
      margin-top:10px;
    }
    .set-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
      font-weight:800;
    }
    .history-item{
      background:rgba(15,23,42,.6);
      border:1px solid rgba(148,163,184,.12);
      border-radius:14px;
      padding:12px;
      margin-top:10px;
    }
    .pill{
      display:inline-block;
      background:rgba(34,197,94,.14);
      color:#bbf7d0;
      padding:5px 9px;
      border-radius:999px;
      font-size:.8rem;
      margin:6px 6px 0 0;
    }
    canvas{
      width:100%;
      height:220px;
      display:block;
      background:linear-gradient(180deg, rgba(15,23,42,.35), rgba(15,23,42,.7));
      border-radius:16px;
      margin-top:10px;
      border:1px solid rgba(148,163,184,.12);
    }
    .footer{
      position:fixed;
      left:0;right:0;bottom:0;
      padding:10px 12px calc(16px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg, rgba(2,6,23,0), rgba(2,6,23,.95) 35%, rgba(2,6,23,1));
      z-index:60;
    }
    .footer-inner{
      max-width:920px;
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    .footer button{
      border:0;
      border-radius:16px;
      padding:14px 10px;
      background:var(--muted);
      color:var(--text);
      font-weight:800;
      cursor:pointer;
    }
    .footer button.active{
      background:var(--green);
      color:#052e16;
    }
    .empty{
      text-align:center;
      padding:28px 14px;
      color:var(--sub);
    }
    @media (max-width:720px){
      .stats{grid-template-columns:1fr}
    }
    @media (max-width:560px){
      .grid-2,.footer-inner{grid-template-columns:1fr}
      .footer button{padding:12px 10px}
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    const STORAGE_KEY = "training-pro-final-user-plan-v1";

    const defaultPlan = {
      days: {
        A: {
          label: "Poniedziałek",
          exercises: [
            { name: "Wyciskanie sztangi leżąc", targetSets: 4, repRange: "5-7" },
            { name: "Wiosłowanie nachwytem sztangi", targetSets: 4, repRange: "6-8" },
            { name: "Przyciąganie drążka do bioder stojąc (narciarz)", targetSets: 3, repRange: "12-15" },
            { name: "Wznosy hantli na boki", targetSets: 3, repRange: "8-10" },
            { name: "Przysiad bułgarski z hantlami", targetSets: 4, repRange: "8-10" },
            { name: "Uginanie nóg na maszynie", targetSets: 4, repRange: "10-12" }
          ]
        },
        B: {
          label: "Środa",
          exercises: [
            { name: "Przysiad klasyczny ze sztangą", targetSets: 4, repRange: "5-7" },
            { name: "Podciąganie na drążku nachwytem", targetSets: 4, repRange: "5-7" },
            { name: "Wyciskanie na ławce ze skosem dodatnim (20-30°)", targetSets: 4, repRange: "8-10" },
            { name: "Wznosy hantli na boki", targetSets: 3, repRange: "10-12" },
            { name: "Facepull", targetSets: 4, repRange: "8-10" },
            { name: "Uginanie przedramion ze sztangą", targetSets: 3, repRange: "8-10" },
            { name: "Uginanie przedramion z hantlami młotkowo", targetSets: 2, repRange: "8-10" }
          ]
        },
        C: {
          label: "Piątek",
          exercises: [
            { name: "Martwy ciąg", targetSets: 4, repRange: "4-6" },
            { name: "Wyciskanie żołnierskie", targetSets: 4, repRange: "6-8" },
            { name: "Przyciąganie poziome na maszynie", targetSets: 3, repRange: "8-10" },
            { name: "Rozpiętki na ławce ze skosem dodatnim", targetSets: 4, repRange: "12-15" },
            { name: "Pompki na poręczach", targetSets: 2, repRange: "10-12" },
            { name: "Francuz sztanga nachwytem leżąc", targetSets: 3, repRange: "8-10" },
            { name: "Prostowanie na wyciągu nachwytem", targetSets: 2, repRange: "10-12" }
          ]
        }
      },
      increment: 2.5
    };

    function clone(obj){
      return JSON.parse(JSON.stringify(obj));
    }

    function num(v){
      const n = Number(String(v).replace(",", "."));
      return Number.isFinite(n) ? n : 0;
    }

    function formatDate(iso){
      const d = new Date(iso);
      return d.toLocaleDateString("pl-PL", {day:"2-digit", month:"2-digit", year:"numeric"}) +
        " • " +
        d.toLocaleTimeString("pl-PL", {hour:"2-digit", minute:"2-digit"});
    }

    function makeExercise(name, targetSets=3, repRange=""){
      return {
        name,
        targetSets,
        repRange,
        sets: Array.from({length: targetSets}, (_, i) => ({
          setNo: i + 1,
          weight: "",
          reps: ""
        }))
      };
    }

    function makeDraft(dayKey, plan){
      return {
        dayKey,
        notes: "",
        startedAt: new Date().toISOString(),
        exercises: plan.days[dayKey].exercises.map(ex => makeExercise(ex.name, ex.targetSets, ex.repRange))
      };
    }

    function loadState(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        try{
          const parsed = JSON.parse(raw);
          const plan = parsed.plan || clone(defaultPlan);
          const day = parsed.selectedDay || "A";
          return {
            activeTab: parsed.activeTab || "workout",
            selectedDay: day,
            plan,
            workouts: parsed.workouts || [],
            draft: parsed.draft || makeDraft(day, plan),
            editWorkoutId: null,
            selectedProgressExercise: parsed.selectedProgressExercise || "",
            chartMetric: parsed.chartMetric || "weight"
          };
        }catch(e){}
      }
      const plan = clone(defaultPlan);
      return {
        activeTab: "workout",
        selectedDay: "A",
        plan,
        workouts: [],
        draft: makeDraft("A", plan),
        editWorkoutId: null,
        selectedProgressExercise: "",
        chartMetric: "weight"
      };
    }

    const state = loadState();

    function save(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        activeTab: state.activeTab,
        selectedDay: state.selectedDay,
        plan: state.plan,
        workouts: state.workouts,
        draft: state.draft,
        selectedProgressExercise: state.selectedProgressExercise,
        chartMetric: state.chartMetric
      }));
    }

    function switchTab(tab){
      state.activeTab = tab;
      save();
      render();
    }

    function switchDay(dayKey){
      state.selectedDay = dayKey;
      state.draft = makeDraft(dayKey, state.plan);
      save();
      render();
    }

    function updateSet(exIndex, setIndex, field, value){
      state.draft.exercises[exIndex].sets[setIndex][field] = value;
      save();
    }

    function addSet(exIndex){
      const sets = state.draft.exercises[exIndex].sets;
      sets.push({ setNo: sets.length + 1, weight: "", reps: "" });
      save();
      render();
    }

    function removeSet(exIndex, setIndex){
      const sets = state.draft.exercises[exIndex].sets;
      if(sets.length <= 1) return;
      sets.splice(setIndex, 1);
      sets.forEach((s, i) => s.setNo = i + 1);
      save();
      render();
    }

    function saveWorkout(){
      const doneExercises = state.draft.exercises
        .map(ex => ({
          ...ex,
          sets: ex.sets.filter(s => s.weight !== "" || s.reps !== "")
        }))
        .filter(ex => ex.name.trim() && ex.sets.length);

      if(!doneExercises.length){
        alert("Najpierw wpisz chociaż jedną serię.");
        return;
      }

      const workout = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        date: new Date().toISOString(),
        dayKey: state.selectedDay,
        dayLabel: state.plan.days[state.selectedDay].label,
        notes: state.draft.notes || "",
        exercises: doneExercises
      };

      state.workouts.unshift(workout);
      state.draft = makeDraft(state.selectedDay, state.plan);
      state.activeTab = "history";
      save();
      render();
    }

    function deleteWorkout(id){
      if(!confirm("Usunąć ten trening?")) return;
      state.workouts = state.workouts.filter(w => w.id !== id);
      save();
      render();
    }

    function editWorkout(id){
      const workout = state.workouts.find(w => w.id === id);
      if(!workout) return;
      state.editWorkoutId = id;
      const html = `
        <div class="card">
          <div class="title">
            <div>
              <div class="exercise">Edytuj trening</div>
              <div class="small">${formatDate(workout.date)}</div>
            </div>
          </div>
          ${workout.exercises.map((ex, exIndex) => `
            <div class="set-row">
              <label>Nazwa ćwiczenia</label>
              <input value="${escapeHtml(ex.name)}" oninput="updateHistoryExerciseName('${id}', ${exIndex}, this.value)">
              ${ex.sets.map((set, setIndex) => `
                <div class="grid-2" style="margin-top:10px">
                  <div>
                    <label>Ciężar</label>
                    <input value="${escapeHtml(String(set.weight))}" oninput="updateHistorySet('${id}', ${exIndex}, ${setIndex}, 'weight', this.value)">
                  </div>
                  <div>
                    <label>Powtórzenia</label>
                    <input value="${escapeHtml(String(set.reps))}" oninput="updateHistorySet('${id}', ${exIndex}, ${setIndex}, 'reps', this.value)">
                  </div>
                </div>
              `).join("")}
            </div>
          `).join("")}
          <div class="grid-2">
            <button class="btn secondary" onclick="closeEditor()">Zamknij</button>
            <button class="btn" onclick="saveEditedWorkout()">Zapisz zmiany</button>
          </div>
        </div>
      `;
      document.getElementById("editor-area").innerHTML = html;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeEditor(){
      state.editWorkoutId = null;
      render();
    }

    function updateHistoryExerciseName(id, exIndex, value){
      const workout = state.workouts.find(w => w.id === id);
      if(workout) workout.exercises[exIndex].name = value;
    }

    function updateHistorySet(id, exIndex, setIndex, field, value){
      const workout = state.workouts.find(w => w.id === id);
      if(workout) workout.exercises[exIndex].sets[setIndex][field] = value;
    }

    function saveEditedWorkout(){
      save();
      state.editWorkoutId = null;
      render();
    }

    function getExerciseHistory(name){
      const list = [];
      state.workouts.forEach(w => {
        w.exercises.forEach(ex => {
          if(ex.name === name){
            const bestWeight = Math.max(...ex.sets.map(s => num(s.weight)), 0);
            const bestReps = Math.max(...ex.sets.map(s => num(s.reps)), 0);
            const volume = ex.sets.reduce((sum, s) => sum + num(s.weight) * num(s.reps), 0);
            list.push({
              date: w.date,
              bestWeight,
              bestReps,
              volume,
              sets: ex.sets.length
            });
          }
        });
      });
      return list.sort((a,b) => new Date(a.date) - new Date(b.date));
    }

    function getAllExerciseNames(){
      const names = new Set();
      state.workouts.forEach(w => w.exercises.forEach(ex => names.add(ex.name)));
      state.draft.exercises.forEach(ex => names.add(ex.name));
      Object.values(state.plan.days).forEach(day =>
        day.exercises.forEach(ex => names.add(ex.name))
      );
      return [...names].filter(Boolean);
    }

    function getSuggestion(name){
      const hist = getExerciseHistory(name);
      if(!hist.length) return "Brak historii";
      const last = hist[hist.length - 1];
      return `Sugestia: spróbuj ${last.bestWeight + state.plan.increment} kg lub więcej powtórzeń`;
    }

    function renderChart(canvas, points){
      const ctx = canvas.getContext("2d");
      const ratio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      ctx.scale(ratio, ratio);
      ctx.clearRect(0, 0, width, height);

      const pad = 24;
      const values = points.map(p => p.value);
      const max = Math.max(...values, 1);
      const min = Math.min(...values, 0);
      const range = Math.max(max - min, 1);

      ctx.strokeStyle = "rgba(148,163,184,.25)";
      ctx.lineWidth = 1;
      for(let i=0;i<4;i++){
        const y = pad + ((height - pad * 2) / 3) * i;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(width - pad, y);
        ctx.stroke();
      }

      if(points.length === 1){
        const x = width / 2;
        const y = height - pad - ((points[0].value - min) / range) * (height - pad * 2);
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      points.forEach((p, i) => {
        const x = pad + (i / (points.length - 1)) * (width - pad * 2);
        const y = height - pad - ((p.value - min) / range) * (height - pad * 2);
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.fillStyle = "#22c55e";
      points.forEach((p, i) => {
        const x = pad + (i / (points.length - 1)) * (width - pad * 2);
        const y = height - pad - ((p.value - min) / range) * (height - pad * 2);
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function exportCSV(){
      const rows = [["date","day","exercise","target_reps","set","weight","reps","volume","notes"]];
      state.workouts.forEach(w => {
        w.exercises.forEach(ex => {
          ex.sets.forEach((set, idx) => {
            rows.push([
              new Date(w.date).toLocaleDateString("pl-PL"),
              w.dayKey,
              ex.name,
              ex.repRange || "",
              idx + 1,
              set.weight,
              set.reps,
              num(set.weight) * num(set.reps),
              w.notes || ""
            ]);
          });
        });
      });

      const csv = rows.map(r =>
        r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")
      ).join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "trening-historia.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetAll(){
      if(!confirm("Usunąć całą historię i wszystkie dane?")) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function workoutView(){
      const day = state.plan.days[state.selectedDay];

      return `
        <div class="card">
          <div class="title">
            <div>
              <div class="exercise">Dzień ${state.selectedDay}</div>
              <div class="muted">${day.label} • działa offline</div>
            </div>
            <div class="badge">${state.workouts.length} zapisanych treningów</div>
          </div>
          <div class="days">
            ${Object.keys(state.plan.days).map(key => `
              <button class="day-btn ${state.selectedDay === key ? "active" : ""}" onclick="switchDay('${key}')">
                ${key} • ${state.plan.days[key].label}
              </button>
            `).join("")}
          </div>
        </div>

        ${state.draft.exercises.map((ex, exIndex) => {
          const hist = getExerciseHistory(ex.name);
          const last = hist[hist.length - 1];
          const best = hist.length ? Math.max(...hist.map(h => h.bestWeight), 0) : 0;

          return `
            <div class="card">
              <div class="title">
                <div>
                  <div class="exercise">${escapeHtml(ex.name)}</div>
                  <div class="muted">Serie: ${ex.targetSets} • Powtórzenia: ${ex.repRange || "-"}</div>
                </div>
                <div class="badge">${last ? `Ostatnio: ${last.bestWeight} kg × ${last.bestReps}` : "Brak historii"}</div>
              </div>

              <div class="stats">
                <div class="stat">
                  <small>Ostatni wynik</small>
                  <strong>${last ? `${last.bestWeight} kg × ${last.bestReps}` : "-"}</strong>
                </div>
                <div class="stat">
                  <small>Rekord</small>
                  <strong>${best || 0} kg</strong>
                </div>
                <div class="stat">
                  <small>Propozycja</small>
                  <strong>${escapeHtml(getSuggestion(ex.name))}</strong>
                </div>
              </div>

              ${ex.sets.map((set, setIndex) => `
                <div class="set-row">
                  <div class="set-top">
                    <span>Seria ${set.setNo}</span>
                    <button class="small-btn" onclick="removeSet(${exIndex}, ${setIndex})">Usuń</button>
                  </div>
                  <div class="grid-2">
                    <div>
                      <label>Ciężar (kg)</label>
                      <input inputmode="decimal" placeholder="np. 60" value="${escapeHtml(set.weight)}"
                        oninput="updateSet(${exIndex}, ${setIndex}, 'weight', this.value)">
                    </div>
                    <div>
                      <label>Powtórzenia</label>
                      <input inputmode="numeric" placeholder="${escapeHtml(ex.repRange || "np. 8")}" value="${escapeHtml(set.reps)}"
                        oninput="updateSet(${exIndex}, ${setIndex}, 'reps', this.value)">
                    </div>
                  </div>
                </div>
              `).join("")}

              <button class="btn secondary" onclick="addSet(${exIndex})">+ Dodaj serię</button>
            </div>
          `;
        }).join("")}

        <div class="card">
          <div style="margin-top:10px">
            <label>Notatki treningowe</label>
            <textarea oninput="state.draft.notes=this.value;save();">${escapeHtml(state.draft.notes || "")}</textarea>
          </div>
          <button class="btn" onclick="saveWorkout()">Zakończ i zapisz trening</button>
        </div>
      `;
    }

    function historyView(){
      if(!state.workouts.length){
        return `<div class="card empty">Brak historii. Zapisz pierwszy trening.</div>`;
      }

      return `
        <div id="editor-area"></div>
        <div class="card">
          <div class="title">
            <div>
              <div class="exercise">Historia treningów</div>
              <div class="small">Możesz edytować, usuwać i eksportować</div>
            </div>
            <div class="toolbar">
              <button class="small-btn" onclick="exportCSV()">Eksport CSV</button>
            </div>
          </div>
          ${state.workouts.map(w => `
            <div class="history-item">
              <div class="title">
                <div>
                  <div class="exercise">Dzień ${w.dayKey} • ${w.dayLabel}</div>
                  <div class="small">${formatDate(w.date)}</div>
                </div>
                <div class="toolbar">
                  <button class="small-btn" onclick="editWorkout('${w.id}')">Edytuj</button>
                  <button class="small-btn" onclick="deleteWorkout('${w.id}')">Usuń</button>
                </div>
              </div>
              ${w.exercises.map(ex => {
                const volume = Math.round(ex.sets.reduce((sum, s) => sum + num(s.weight) * num(s.reps), 0));
                return `
                  <div class="pill">${escapeHtml(ex.name)}</div>
                  <div class="small">Cel: ${escapeHtml(ex.repRange || "-")} • ${ex.sets.map(s => `${s.weight || 0}kg × ${s.reps || 0}`).join(" • ")} • objętość ${volume}</div>
                `;
              }).join("<div style='height:8px'></div>")}
              ${w.notes ? `<div class="small" style="margin-top:10px">Notatka: ${escapeHtml(w.notes)}</div>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    function progressView(){
      const exerciseNames = getAllExerciseNames().filter(name => getExerciseHistory(name).length);
      if(!exerciseNames.length){
        return `<div class="card empty">Nie ma jeszcze danych do progresu.</div>`;
      }

      if(!state.selectedProgressExercise || !exerciseNames.includes(state.selectedProgressExercise)){
        state.selectedProgressExercise = exerciseNames[0];
      }

      const history = getExerciseHistory(state.selectedProgressExercise);
      const last = history[history.length - 1];
      const prev = history[history.length - 2];
      const deltaWeight = prev ? last.bestWeight - prev.bestWeight : 0;
      const deltaVolume = prev ? Math.round(last.volume - prev.volume) : 0;
      const record = Math.max(...history.map(h => h.bestWeight), 0);

      setTimeout(() => {
        const canvas = document.getElementById("progressChart");
        if(canvas){
          const metric = state.chartMetric;
          renderChart(canvas, history.map((h, i) => ({
            label: String(i + 1),
            value: metric === "volume" ? h.volume : h.bestWeight
          })));
        }
      }, 0);

      return `
        <div class="card">
          <div class="title">
            <div>
              <div class="exercise">Progres</div>
              <div class="small">Wybierz ćwiczenie i metrykę</div>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>Ćwiczenie</label>
              <select onchange="state.selectedProgressExercise=this.value;save();render()">
                ${exerciseNames.map(name => `
                  <option ${state.selectedProgressExercise === name ? "selected" : ""}>${escapeHtml(name)}</option>
                `).join("")}
              </select>
            </div>
            <div>
              <label>Metryka wykresu</label>
              <select onchange="state.chartMetric=this.value;save();render()">
                <option value="weight" ${state.chartMetric === "weight" ? "selected" : ""}>Najlepszy ciężar</option>
                <option value="volume" ${state.chartMetric === "volume" ? "selected" : ""}>Objętość</option>
              </select>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <small>Ostatni wynik</small>
              <strong>${last.bestWeight} kg × ${last.bestReps}</strong>
            </div>
            <div class="stat">
              <small>Zmiana ciężaru</small>
              <strong>${deltaWeight > 0 ? "+" : ""}${deltaWeight} kg</strong>
            </div>
            <div class="stat">
              <small>Zmiana objętości</small>
              <strong>${deltaVolume > 0 ? "+" : ""}${deltaVolume}</strong>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <small>Rekord</small>
              <strong>${record} kg</strong>
            </div>
            <div class="stat">
              <small>Sesji</small>
              <strong>${history.length}</strong>
            </div>
            <div class="stat">
              <small>Sugestia</small>
              <strong>${escapeHtml(getSuggestion(state.selectedProgressExercise))}</strong>
            </div>
          </div>

          <canvas id="progressChart"></canvas>
        </div>
      `;
    }

    function settingsView(){
      return `
        <div class="card">
          <div class="title">
            <div>
              <div class="exercise">Ustawienia</div>
              <div class="small">Plan, progres, eksport i reset</div>
            </div>
          </div>

          <label>Domyślna progresja ciężaru (kg)</label>
          <input inputmode="decimal" value="${state.plan.increment}" oninput="state.plan.increment=num(this.value)||0;save()">

          <button class="btn secondary" onclick="exportCSV()">Eksport historii do CSV</button>
          <button class="btn danger" onclick="resetAll()">Reset wszystkich danych</button>

          <div class="small" style="margin-top:10px">
            CSV otworzysz w Excelu albo zaimportujesz do Google Sheets.
          </div>
        </div>
      `;
    }

    function render(){
      document.getElementById("app").innerHTML = `
        <div class="topbar">
          <h1>Trening PRO Final</h1>
          <div class="sub">Twój plan A / B / C • historia • progres • rekordy • eksport • offline</div>
        </div>

        ${state.activeTab === "workout" ? workoutView() : ""}
        ${state.activeTab === "history" ? historyView() : ""}
        ${state.activeTab === "progress" ? progressView() : ""}
        ${state.activeTab === "settings" ? settingsView() : ""}
      `;

      document.querySelectorAll(".footer button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
      });
    }

    window.switchTab = switchTab;
    window.switchDay = switchDay;
    window.updateSet = updateSet;
    window.addSet = addSet;
    window.removeSet = removeSet;
    window.saveWorkout = saveWorkout;
    window.deleteWorkout = deleteWorkout;
    window.editWorkout = editWorkout;
    window.updateHistoryExerciseName = updateHistoryExerciseName;
    window.updateHistorySet = updateHistorySet;
    window.saveEditedWorkout = saveEditedWorkout;
    window.closeEditor = closeEditor;
    window.exportCSV = exportCSV;
    window.resetAll = resetAll;
    window.state = state;
    window.save = save;

    render();
  </script>

  <div class="footer">
    <div class="footer-inner">
      <button data-tab="workout" class="active" onclick="switchTab('workout')">Trening</button>
      <button data-tab="history" onclick="switchTab('history')">Historia</button>
      <button data-tab="progress" onclick="switchTab('progress')">Progres</button>
      <button data-tab="settings" onclick="switchTab('settings')">Ustawienia</button>
    </div>
  </div>
</body>
</html>
